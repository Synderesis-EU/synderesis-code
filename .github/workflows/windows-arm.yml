name: Windows model-call and login verification
run-name: Windows runtime ${{ inputs.revision }} production ${{ inputs.build_run }} protocol ${{ inputs.protocol_run }}
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful production Windows build run
        required: true
      protocol_run:
        description: Successful Windows test-binary run of the same source
        required: true
      revision:
        description: Exact runtime revision to verify
        required: true
      preseed_agent_id:
        description: Diagnostic only - reuse a cached device identifier
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  arm-model-call:
    strategy:
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          PROTOCOL_RUN: ${{ inputs.protocol_run }}
          REVISION: ${{ inputs.revision }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REVISION -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source revision' }
          foreach ($Run in @(@{ Id = $env:BUILD_RUN; File = 'windows.yml' }, @{ Id = $env:PROTOCOL_RUN; File = 'windows-protocol.yml' })) {
            if ($Run.Id -notmatch '^\d+$') { throw 'Invalid run id' }
            $Metadata = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($Run.Id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $Metadata.path -ne ".github/workflows/$($Run.File)") { throw 'Artifact provenance mismatch' }
            if ($Metadata.head_branch -ne $env:SOURCE_BRANCH -or $Metadata.event -ne 'workflow_dispatch') { throw 'Unexpected artifact source' }
            if ($Run.File -eq 'windows.yml' -and ($Metadata.conclusion -ne 'success' -or $Metadata.head_sha -ne $env:REVISION)) { throw 'Production build did not pass for requested revision' }
            if ($Run.File -eq 'windows-protocol.yml') {
              # Verification scripts may advance while the selected runtime is
              # pinned. Require identical compiled source plus its build receipt.
              git fetch --no-tags origin $env:REVISION $Metadata.head_sha
              if ($LASTEXITCODE -ne 0) { throw 'Protocol source provenance fetch failed' }
              git diff --exit-code $env:REVISION $Metadata.head_sha -- crates Cargo.toml Cargo.lock .cargo
              if ($LASTEXITCODE -ne 0) { throw 'Protocol runtime source differs from requested revision' }
              $Jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($Run.Id)/jobs" | ConvertFrom-Json
              $Compiled = @($Jobs.jobs.steps | Where-Object { $_.name -eq 'Build isolated test binary' -and $_.conclusion -eq 'success' })
              if ($LASTEXITCODE -ne 0 -or $Compiled.Count -ne 1) { throw 'Test binary compilation was not successful' }
            }
          }
          gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name synderesis-code-windows-x86_64 --dir fixture
          if ($LASTEXITCODE -ne 0) { throw 'Production artifact download failed' }
          gh run download $env:PROTOCOL_RUN --repo $env:GITHUB_REPOSITORY --name synderesis-code-loopback-test-only --dir test-binary
          if ($LASTEXITCODE -ne 0) { throw 'Test artifact download failed' }
          if ((Get-Content test-binary/BUILD-COMMIT.txt -Raw).Trim() -ne $env:REVISION) { throw 'Wrong test executable build revision' }
      - name: Verify production x64 executable on Windows ARM
        shell: pwsh
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.os }}' -eq 'windows-11-arm' -and [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') { throw 'This test requires real Windows ARM' }
          Expand-Archive fixture/synderesis-code-windows-x86_64.zip fixture/production
          if ((Get-Content fixture/production/BUILD-COMMIT.txt -Raw).Trim() -ne $env:REVISION) { throw 'Wrong packaged source' }
          $env:SYNDERESIS_API_KEY = 'synthetic-arm-startup-check'
          $env:SYNDERESIS_CODE_HOME = "$env:RUNNER_TEMP/arm-startup-state"
          & ./fixture/production/synderesis-code.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'ARM-emulated version failed' }
          & ./fixture/production/synderesis-code.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'ARM-emulated help failed' }
      - name: Exercise model request and tool response under ARM emulation
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path test-binary/synderesis-code.exe).Path
          python synderesis/check_tool_roundtrip.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM model/tool roundtrip failed' }
          $env:SYNDERESIS_FIXTURE_MODELS_UNAVAILABLE = '1'
          python synderesis/check_tool_roundtrip.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM unavailable-catalog roundtrip failed' }
      - name: Exercise Synderesis sign-in and model calls on ARM
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path test-binary/synderesis-code.exe).Path
          python synderesis/check_login_roundtrip.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM Synderesis login roundtrip failed' }
      - name: Verify production HTTPS model route on ARM
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_PRODUCTION_BINARY = (Resolve-Path fixture/production/synderesis-code.exe).Path
          python synderesis/check_production_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'ARM production transport failed' }
      - name: Prepare native terminal driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $TerminalPython = 'python'
          if ('${{ matrix.os }}' -eq 'windows-11-arm') {
            # The ARM wheel currently fails to load its native DLL. Use the
            # supported x64 terminal driver under the same emulation as the CLI.
            $PythonRoot = "$env:RUNNER_TEMP/terminal-python-x64"
            Invoke-WebRequest https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip -OutFile "$env:RUNNER_TEMP/python-x64.zip"
            Expand-Archive "$env:RUNNER_TEMP/python-x64.zip" $PythonRoot
            $WheelMetadata = Invoke-RestMethod https://pypi.org/pypi/pywinpty/3.0.3/json
            $Wheel = @($WheelMetadata.urls | Where-Object { $_.filename -eq 'pywinpty-3.0.3-cp313-cp313-win_amd64.whl' })
            if ($Wheel.Count -ne 1) { throw 'Expected terminal driver wheel missing' }
            Invoke-WebRequest $Wheel[0].url -OutFile "$env:RUNNER_TEMP/terminal-driver.zip"
            if ((Get-FileHash "$env:RUNNER_TEMP/terminal-driver.zip" -Algorithm SHA256).Hash.ToLower() -ne $Wheel[0].digests.sha256) { throw 'Terminal driver checksum mismatch' }
            Expand-Archive "$env:RUNNER_TEMP/terminal-driver.zip" "$PythonRoot/Lib/site-packages"
            @('python313.zip', '.', 'Lib/site-packages', "$((Get-Location).Path)/synderesis", 'import site') | Set-Content "$PythonRoot/python313._pth"
            $TerminalPython = "$PythonRoot/python.exe"
            & $TerminalPython -c 'from winpty import PtyProcess; print("x64 terminal driver loaded on Windows ARM")'
            if ($LASTEXITCODE -ne 0) { throw 'Emulated terminal driver failed to load' }
          } else {
            python -m pip install --only-binary=:all: pywinpty==3.0.3
            if ($LASTEXITCODE -ne 0) { throw 'Native terminal test dependency installation failed' }
          }
          "TERMINAL_PYTHON=$TerminalPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compare production and fixture terminal startup
        shell: pwsh
        env:
          SYNDERESIS_TEST_PRESEED_AGENT_ID: ${{ inputs.preseed_agent_id && '1' || '0' }}
        run: |
          $Failed = @()
          $Preseed = $env:SYNDERESIS_TEST_PRESEED_AGENT_ID
          foreach ($Case in @(
            @{ Name = 'production'; Binary = 'fixture/production/synderesis-code.exe'; Args = '[]' },
            @{ Name = 'fixture'; Binary = 'test-binary/synderesis-code.exe'; Args = '[]' },
            @{ Name = 'fixture-no-leader'; Binary = 'test-binary/synderesis-code.exe'; Args = '["--no-leader"]' },
            @{ Name = 'fixture-existing-identity'; Binary = 'test-binary/synderesis-code.exe'; Args = '[]'; Cached = $true }
          )) {
            $env:SYNDERESIS_TEST_PRESEED_AGENT_ID = if ($Case.Cached) { '1' } else { $Preseed }
            $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path $Case.Binary).Path
            $env:SYNDERESIS_TEST_CLI_ARGS = $Case.Args
            $env:SYNDERESIS_TEST_DIAGNOSTIC_DIR = "$env:RUNNER_TEMP/terminal-diagnostics/$($Case.Name)"
            & $env:TERMINAL_PYTHON synderesis/check_cmd_startup.py
            if ($LASTEXITCODE -ne 0) { $Failed += $Case.Name }
          }
          if ($Failed.Count -gt 0) { throw "Terminal startup failed: $($Failed -join ', ')" }
      - name: Save synthetic startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal-diagnostics
          if-no-files-found: ignore
      - name: Exercise literal /login at three terminal sizes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path test-binary/synderesis-code.exe).Path
          foreach ($size in @(@(40,160), @(32,100), @(22,70))) {
            $env:SYNDERESIS_TEST_ROWS = "$($size[0])"
            $env:SYNDERESIS_TEST_COLS = "$($size[1])"
            & $env:TERMINAL_PYTHON synderesis/check_interactive_login.py
            if ($LASTEXITCODE -ne 0) { throw "Native /login UI check failed at $($size[1])x$($size[0])" }
          }
      - name: Exercise coding through the interactive terminal worker
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path test-binary/synderesis-code.exe).Path
          $env:SYNDERESIS_TEST_INTERACTIVE_TOOL = '1'
          $env:SYNDERESIS_TEST_ROWS = '32'
          $env:SYNDERESIS_TEST_COLS = '100'
          & $env:TERMINAL_PYTHON synderesis/check_interactive_login.py
          if ($LASTEXITCODE -ne 0) { throw 'Interactive terminal coding workflow failed' }

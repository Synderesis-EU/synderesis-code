name: Windows installer verification
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows build run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Download built native executable
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: gh run download $env:BUILD_RUN --repo $env:GITHUB_REPOSITORY --name synderesis-code-windows-x86_64 --dir fixture
      - name: Verify production endpoint is fixed
        run: python -c "import zipfile; z=zipfile.ZipFile('fixture/synderesis-code-windows-x86_64.zip'); assert all(k not in z.read('synderesis-code.exe') for k in (b'SYNDERESIS_CODE_TEST_BASE_URL', b'SYNDERESIS_CODE_TEST_AUTH_ORIGIN'))"
      - name: Test architecture detection
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File synderesis/check_architecture.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installation and checksum rejection
        shell: pwsh
        env:
          TEST_SHELL: ${{ matrix.shell }}
        run: |
          & $env:TEST_SHELL -NoProfile -NonInteractive -ExecutionPolicy Bypass -File synderesis/check_installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: Windows tool roundtrip
on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Optional already-built runtime commit (must match current Rust source)
        default: ''
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current checks and select runtime
        shell: pwsh
        env:
          BUILD_REF: ${{ inputs.build_ref }}
        run: |
          Copy-Item synderesis "$env:RUNNER_TEMP/verification" -Recurse
          if ($env:BUILD_REF) {
            git fetch origin $env:BUILD_REF
            git diff --exit-code $env:BUILD_REF HEAD -- crates Cargo.toml Cargo.lock .cargo
            if ($LASTEXITCODE -ne 0) { throw 'Selected runtime differs from current Rust source' }
            git checkout --detach $env:BUILD_REF
            if ($LASTEXITCODE -ne 0) { throw 'Runtime checkout failed' }
          }
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-1.94-${{ hashFiles('Cargo.lock') }}-${{ inputs.build_ref || github.sha }}
          restore-keys: |
            windows-rust-1.94-${{ hashFiles('Cargo.lock') }}-
            windows-rust-1.94-
      - name: Reuse unchanged source timestamps from the restored build
        if: steps.cache.outputs.cache-matched-key != ''
        shell: pwsh
        env:
          CACHED_BUILD_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: python synderesis/reuse_build_timestamps.py "$env:CACHED_BUILD_KEY"
      - name: Install protobuf compiler
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip -OutFile "$env:RUNNER_TEMP/protoc.zip"
          Expand-Archive "$env:RUNNER_TEMP/protoc.zip" "$env:RUNNER_TEMP/protoc"
          "PROTOC=$env:RUNNER_TEMP/protoc/bin/protoc.exe" >> $env:GITHUB_ENV
      - name: Build isolated test binary
        run: cargo build -p xai-grok-pager-bin --release --locked --target x86_64-pc-windows-msvc --features synderesis-test-endpoint
      - name: Preserve test-only executable for verification retries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-binary
          Copy-Item target/x86_64-pc-windows-msvc/release/synderesis-code.exe test-binary/
          git rev-parse HEAD | Set-Content test-binary/BUILD-COMMIT.txt
      - name: Upload test-only executable for verification retries
        uses: actions/upload-artifact@v4
        with:
          name: synderesis-code-loopback-test-only
          path: test-binary/*
      - name: Exercise HTTP and local file tool
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path target/x86_64-pc-windows-msvc/release/synderesis-code.exe).Path
          python "$env:RUNNER_TEMP/verification/check_tool_roundtrip.py"
      - name: Exercise startup with unavailable model catalog
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path target/x86_64-pc-windows-msvc/release/synderesis-code.exe).Path
          $env:SYNDERESIS_FIXTURE_MODELS_UNAVAILABLE = '1'
          python "$env:RUNNER_TEMP/verification/check_tool_roundtrip.py"
      - name: Exercise native CMD interactive interface
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.3
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path target/x86_64-pc-windows-msvc/release/synderesis-code.exe).Path
          python "$env:RUNNER_TEMP/verification/check_cmd_startup.py"
      - name: Exercise interactive Synderesis sign-in and account switching
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path target/x86_64-pc-windows-msvc/release/synderesis-code.exe).Path
          python "$env:RUNNER_TEMP/verification/check_login_roundtrip.py"
          if ($LASTEXITCODE -ne 0) { throw 'Synderesis login roundtrip failed' }
      - name: Exercise literal /login in native CMD
        shell: pwsh
        run: |
          $env:SYNDERESIS_CODE_TEST_BINARY = (Resolve-Path target/x86_64-pc-windows-msvc/release/synderesis-code.exe).Path
          foreach ($size in @(@(40,160), @(32,100), @(22,70))) {
            $env:SYNDERESIS_TEST_ROWS = "$($size[0])"
            $env:SYNDERESIS_TEST_COLS = "$($size[1])"
            python "$env:RUNNER_TEMP/verification/check_interactive_login.py"
            if ($LASTEXITCODE -ne 0) { throw "Native /login UI check failed at $($size[1])x$($size[0])" }
          }
